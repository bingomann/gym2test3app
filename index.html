<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Track Minimal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-color: #00e676;
            --text-color: #f0f0f0;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --danger-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        .exercise-item {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .exercise-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .set-row {
            display: grid;
            grid-template-columns: 30px 1fr 1fr 40px;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .set-num {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        input[type="number"], input[type="text"], select {
            background-color: #000;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            text-align: center;
        }

        input::placeholder {
            color: #444;
        }

        .checkbox-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .checkbox-btn.done {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
        }

        .last-values {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            text-align: center;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">Gym Track</h1>
        <button id="btn-save-workout" class="btn btn-sm" style="display:none;">Abschließen</button>
    </header>

    <div class="container">
        <!-- SEITE: WORKOUT -->
        <div id="page-workout" class="page active">
            <div id="select-plan-view" class="card">
                <div class="card-title">Training starten</div>
                <select id="workout-plan-select" style="margin-bottom: 12px;">
                    <option value="">-- Plan auswählen --</option>
                </select>
                <button id="btn-start-workout" class="btn">Workout Starten</button>
            </div>

            <div id="active-workout-view" style="display:none;">
                <div id="exercise-list"></div>
            </div>
        </div>

        <!-- SEITE: FORTSCHRITT -->
        <div id="page-progress" class="page">
            <div class="card">
                <div class="card-title">1RM Kraftsteigerung</div>
                <select id="chart-exercise-select" style="margin-bottom: 12px;">
                    <option value="">-- Übung auswählen --</option>
                </select>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </div>

        <!-- SEITE: EINSTELLUNGEN & MAßE -->
        <div id="page-settings" class="page">
            <div class="card">
                <div class="card-title">Körpergewicht & Maße</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div>
                        <label style="font-size:0.8rem; color:var(--text-muted);">Gewicht (kg)</label>
                        <input type="number" id="body-weight" step="0.1" placeholder="73.0">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; color:var(--text-muted);">Oberarm (cm)</label>
                        <input type="number" id="body-arm" step="0.5" placeholder="38.0">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; color:var(--text-muted);">Taille (cm)</label>
                        <input type="number" id="body-waist" step="0.5" placeholder="80.0">
                    </div>
                    <button id="btn-save-body" class="btn btn-outline" style="margin-top:5px;">Speichern</button>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">System</div>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">
                    Datenbank: IndexedDB (Persistent)<br>
                    Status: <span id="storage-status" style="color:var(--accent-color);">Prüfe...</span>
                </p>
                <button id="btn-reset-data" class="btn btn-danger">Alle Daten zurücksetzen</button>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" data-page="workout">
            <span>🏋️‍♂️</span>
            <span>Workout</span>
        </div>
        <div class="nav-item" data-page="progress">
            <span>📈</span>
            <span>Fortschritt</span>
        </div>
        <div class="nav-item" data-page="settings">
            <span>⚙️</span>
            <span>Profil</span>
        </div>
    </nav>

    <script>
        // IndexedDB Initialisierung
        let db;
        const dbName = "GymTrackDB";
        const request = indexedDB.open(dbName, 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("workouts")) {
                db.createObjectStore("workouts", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("plans")) {
                db.createObjectStore("plans", { keyPath: "name" });
            }
            if (!db.objectStoreNames.contains("bodyStats")) {
                db.createObjectStore("bodyStats", { keyPath: "date" });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            initApp();
        };

        // Standard-Trainingspläne
        const defaultPlans = [
            {
                name: "Push Day",
                exercises: [
                    "Schrägbankdrücken KH",
                    "Brustpresse Maschine (gerade)",
                    "Brustpresse / Maschine (optional)",
                    "Flys (Kabel/Maschine)",
                    "Schulterdrücken KH",
                    "Seitheben",
                    "Trizeps Pushdown (einarmig)",
                    "Trizeps Pushdown (zweiarmig)"
                ]
            },
            {
                name: "Pull Day",
                exercises: [
                    "High Rows (Breiter Latzug/Rudern)",
                    "Rudern eng (Kabel/Maschine)",
                    "Latzug eng",
                    "Überzüge (Kabel/KH)",
                    "T-Bar Rudern",
                    "Hammer Curls (Langer Bizepskopf)",
                    "SZ-Stangen Curls"
                ]
            },
            {
                name: "Leg Day",
                exercises: [
                    "Squats (Kniebeugen)",
                    "Beinstrecker (Quadrizeps)",
                    "Beinbeuger / Hamstrings",
                    "Adduktoren (Maschine)",
                    "Abduktoren (Maschine)",
                    "Wadenheben"
                ]
            }
        ];

        let activeWorkout = null;
        let chartInstance = null;

        function initApp() {
            // Persistent Storage aktivieren
            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().then(granted => {
                    document.getElementById('storage-status').textContent = granted ? "Geschützt (Dauerhaft)" : "Standard";
                });
            }

            loadPlans();
            setupNavigation();
            setupEventListeners();
        }

        function loadPlans() {
            const tx = db.transaction("plans", "readwrite");
            const store = tx.objectStore("plans");
            
            store.count().onsuccess = (e) => {
                if (e.target.result === 0) {
                    defaultPlans.forEach(plan => store.add(plan));
                }
                populatePlanSelect();
            };
        }

        function populatePlanSelect() {
            const select = document.getElementById("workout-plan-select");
            select.innerHTML = '<option value="">-- Plan auswählen --</option>';
            
            const tx = db.transaction("plans", "readonly");
            tx.objectStore("plans").openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const opt = document.createElement("option");
                    opt.value = cursor.value.name;
                    opt.textContent = cursor.value.name;
                    select.appendChild(opt);
                    cursor.continue();
                }
            };
        }

        function setupNavigation() {
            document.querySelectorAll("nav .nav-item").forEach(item => {
                item.addEventListener("click", () => {
                    document.querySelectorAll("nav .nav-item").forEach(n => n.classList.remove("active"));
                    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                    
                    item.classList.add("active");
                    const pageId = item.getAttribute("data-page");
                    document.getElementById(`page-${pageId}`).classList.add("active");

                    if (pageId === "progress") loadProgressChartSelect();
                });
            });
        }

        function setupEventListeners() {
            document.getElementById("btn-start-workout").addEventListener("click", startWorkout);
            document.getElementById("btn-save-workout").addEventListener("click", finishWorkout);
            document.getElementById("btn-save-body").addEventListener("click", saveBodyStats);
            document.getElementById("chart-exercise-select").addEventListener("change", renderChart);
            document.getElementById("btn-reset-data").addEventListener("click", resetAllData);
        }

        async function startWorkout() {
            const planName = document.getElementById("workout-plan-select").value;
            if (!planName) return alert("Bitte wähle einen Trainingsplan aus.");

            const tx = db.transaction("plans", "readonly");
            const req = tx.objectStore("plans").get(planName);

            req.onsuccess = async () => {
                const plan = req.result;
                activeWorkout = {
                    planName: plan.name,
                    date: new Date().toISOString(),
                    exercises: []
                };

                const container = document.getElementById("exercise-list");
                container.innerHTML = "";

                for (let exName of plan.exercises) {
                    const lastData = await getLastExerciseData(exName);
                    const exCard = document.createElement("div");
                    exCard.className = "card exercise-item";
                    exCard.innerHTML = `
                        <div class="exercise-header">
                            <span class="exercise-name">${exName}</span>
                            <button class="btn btn-outline btn-sm" onclick="addSet('${exName}')">+ Satz</button>
                        </div>
                        <div id="sets-${exName.replace(/\s+/g, '')}"></div>
                    `;
                    container.appendChild(exCard);

                    // 3 Standardsätze anlegen
                    for(let i=1; i<=3; i++) {
                        addSet(exName, lastData ? lastData[i-1] : null);
                    }
                }

                document.getElementById("select-plan-view").style.display = "none";
                document.getElementById("active-workout-view").style.display = "block";
                document.getElementById("btn-save-workout").style.display = "block";
            };
        }

        function addSet(exName, lastSet) {
            const containerId = `sets-${exName.replace(/\s+/g, '')}`;
            const container = document.getElementById(containerId);
            const setIndex = container.children.length + 1;

            const setRow = document.createElement("div");
            setRow.className = "set-row";
            setRow.innerHTML = `
                <div class="set-num">${setIndex}</div>
                <div>
                    <input type="number" class="weight-input" step="0.5" placeholder="kg">
                    <div class="last-values">${lastSet ? lastSet.weight + 'kg' : '-'}</div>
                </div>
                <div>
                    <input type="number" class="reps-input" placeholder="Reps">
                    <div class="last-values">${lastSet ? lastSet.reps + ' Wdh' : '-'}</div>
                </div>
                <div class="checkbox-btn" onclick="toggleSetDone(this)">✓</div>
            `;
            container.appendChild(setRow);
        }

        function toggleSetDone(btn) {
            btn.classList.toggle("done");
        }

        async function finishWorkout() {
            // Sammle Daten
            const planName = document.getElementById("workout-plan-select").value;
            const exercises = [];

            document.querySelectorAll(".exercise-item").forEach(item => {
                const exName = item.querySelector(".exercise-name").textContent;
                const sets = [];
                item.querySelectorAll(".set-row").forEach(row => {
                    const weight = parseFloat(row.querySelector(".weight-input").value) || 0;
                    const reps = parseInt(row.querySelector(".reps-input").value) || 0;
                    const isDone = row.querySelector(".checkbox-btn").classList.contains("done");

                    if (isDone && reps > 0) {
                        sets.push({ weight, reps });
                    }
                });
                if (sets.length > 0) {
                    exercises.push({ name: exName, sets });
                }
            });

            if (exercises.length === 0) {
                if (!confirm("Keine vollendeten Sätze eingegeben. Workout trotzdem beenden?")) return;
            }

            const record = {
                date: new Date().toISOString().split('T')[0],
                planName,
                exercises
            };

            const tx = db.transaction("workouts", "readwrite");
            tx.objectStore("workouts").add(record);

            tx.oncomplete = () => {
                alert("Workout gespeichert!");
                document.getElementById("select-plan-view").style.display = "block";
                document.getElementById("active-workout-view").style.display = "none";
                document.getElementById("btn-save-workout").style.display = "none";
            };
        }

        function getLastExerciseData(exName) {
            return new Promise((resolve) => {
                const tx = db.transaction("workouts", "readonly");
                const store = tx.objectStore("workouts");
                let lastSets = null;

                store.openCursor(null, "prev").onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        const foundEx = cursor.value.exercises.find(ex => ex.name === exName);
                        if (foundEx) {
                            lastSets = foundEx.sets;
                            resolve(lastSets);
                            return;
                        }
                        cursor.continue();
                    } else {
                        resolve(null);
                    }
                };
            });
        }

        function loadProgressChartSelect() {
            const select = document.getElementById("chart-exercise-select");
            select.innerHTML = '<option value="">-- Übung auswählen --</option>';
            
            const exercises = new Set();
            const tx = db.transaction("workouts", "readonly");
            tx.objectStore("workouts").openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    cursor.value.exercises.forEach(ex => exercises.add(ex.name));
                    cursor.continue();
                } else {
                    exercises.forEach(exName => {
                        const opt = document.createElement("option");
                        opt.value = exName;
                        opt.textContent = exName;
                        select.appendChild(opt);
                    });
                }
            };
        }

        function renderChart() {
            const exName = document.getElementById("chart-exercise-select").value;
            if (!exName) return;

            const dates = [];
            const oneRMs = [];

            const tx = db.transaction("workouts", "readonly");
            tx.objectStore("workouts").openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    const foundEx = cursor.value.exercises.find(ex => ex.name === exName);
                    if (foundEx) {
                        // Max 1RM für diesen Tag berechnen (Epley Formel)
                        let max1RM = 0;
                        foundEx.sets.forEach(s => {
                            const e1RM = s.weight * (1 + s.reps / 30);
                            if (e1RM > max1RM) max1RM = e1RM;
                        });
                        dates.push(cursor.value.date);
                        oneRMs.push(max1RM.toFixed(1));
                    }
                    cursor.continue();
                } else {
                    drawChart(dates, oneRMs);
                }
            };
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Max 1RM (kg)',
                        data: data,
                        borderColor: '#00e676',
                        backgroundColor: 'rgba(0, 230, 118, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function saveBodyStats() {
            const weight = parseFloat(document.getElementById("body-weight").value);
            const arm = parseFloat(document.getElementById("body-arm").value);
            const waist = parseFloat(document.getElementById("body-waist").value);

            const record = {
                date: new Date().toISOString().split('T')[0],
                weight, arm, waist
            };

            const tx = db.transaction("bodyStats", "readwrite");
            tx.objectStore("bodyStats").put(record);
            tx.oncomplete = () => alert("Körperdaten gespeichert!");
        }

        function resetAllData() {
            if (confirm("Möchtest du wirklich ALLE Workouts und Pläne löschen?")) {
                indexedDB.deleteDatabase(dbName);
                location.reload();
            }
        }
    </script>
</body>
</html>
